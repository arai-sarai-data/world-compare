name: Update data and publish

on:
  schedule:
    - cron: '41 4 * * 1'   # every Monday 04:41 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  data:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[data]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build data (a failed source keeps its previous file)
        run: node scripts/build.mjs all
      - name: Check data files
        run: node scripts/check.mjs || echo "::warning::some data files are incomplete"
      - name: Commit data
        run: |
          git config user.name "world-compare bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data [data]"
          git pull --rebase origin main && git push

  deploy:
    needs: data
    concurrency:
      group: pages
      cancel-in-progress: true
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

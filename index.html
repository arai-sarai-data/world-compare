<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界くらべ / World, Compared</title>
<meta name="description" content="ばらばらの公開データを組み合わせて、世界の国を比べる7つのサイト。Seven sites that combine scattered public data to compare countries.">
<link rel="stylesheet" href="assets/common.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
</head>
<body>
<header class="top"><span class="home">🌐</span><select class="lang" aria-label="Language"></select></header>
<main id="app"></main>
<footer><div class="wrap muted" id="foot"></div></footer>
<script type="module">
import { LANGS, getLang, common, REPO } from './assets/common.js';
const S = [
  ['jikyu', { ja: ['1時間働くと、何が買える？', '各国の平均賃金と物価から、同じ物を買うのに何時間働くかを比べる。', 'ビッグマック1個は何分の労働？'], en: ['What does an hour of work buy?', 'Wages and prices combined: how long people work to buy the same thing.', 'How many minutes for a Big Mac?'], zh: ['工作1小时能买什么？', '结合工资和物价，比较买同样的东西要工作多久。', '一个巨无霸要工作几分钟？'], ko: ['1시간 일하면 무엇을 살 수 있을까?', '임금과 물가로 같은 물건을 사는 데 몇 시간 일하는지 비교.', '빅맥 1개는 몇 분 노동?'], es: ['¿Qué se compra con una hora de trabajo?', 'Salarios y precios: cuánto se trabaja para comprar lo mismo.', '¿Cuántos minutos por un Big Mac?'] }],
  ['zei', { ja: ['税金の元は取れている？', '税負担の重さと、寿命・治安・学力などの成果を並べて比べる。', '同じ税負担の国より成果は多い？'], en: ['Are taxes paying off?', 'Tax burden next to outcomes like life expectancy, safety and learning.', 'More outcome than similar-tax countries?'], zh: ['税交得值吗？', '把税负与寿命、治安、学力等成果并列比较。', '比同等税负的国家成果更多吗？'], ko: ['세금 낸 만큼 돌아오나?', '세금 부담과 수명·치안·학력 등 성과를 나란히 비교.', '세금이 비슷한 나라보다 성과가 많을까?'], es: ['¿Rinden los impuestos?', 'Carga fiscal frente a resultados como esperanza de vida, seguridad y aprendizaje.', '¿Más resultados que países con impuestos similares?'] }],
  ['yakusoku', { ja: ['国の約束、守られてる？', '国防費2%・援助0.7%など、国際的な数値目標と実際の数字。', '約束を守っている国はいくつ？'], en: ['Are countries keeping their promises?', 'International targets like 2% defence or 0.7% aid, next to reality.', 'How many countries keep them?'], zh: ['各国守约了吗？', '国防2%、援助0.7%等国际数值目标与实际数字。', '有多少国家守约？'], ko: ['나라들은 약속을 지키고 있을까?', '국방비 2%, 원조 0.7% 등 국제 목표와 실제 숫자.', '약속을 지킨 나라는 몇 곳?'], es: ['¿Cumplen los países sus promesas?', 'Metas como 2% en defensa o 0,7% en ayuda, frente a la realidad.', '¿Cuántos países cumplen?'] }],
  ['enjo', { ja: ['援助した国は、国連で味方する？', '援助額と国連総会での投票の一致率を組み合わせる。', '援助と投票に関係はある？'], en: ['Does aid buy votes at the UN?', 'Aid flows combined with UN General Assembly voting agreement.', 'Is there a link?'], zh: ['援助能换来联合国的选票吗？', '把援助额与联大投票一致率结合起来。', '两者有关系吗？'], ko: ['원조한 나라는 유엔에서 편을 들까?', '원조액과 유엔총회 투표 일치율을 결합.', '관계가 있을까?'], es: ['¿La ayuda compra votos en la ONU?', 'Ayuda combinada con la coincidencia de voto en la Asamblea General.', '¿Hay relación?'] }],
  ['giin', { ja: ['議員は国民に似ている？', '国会議員の女性比率と年齢を、国民と比べる。', '議会は国民よりどれだけ男性的で年上？'], en: ['Do parliaments look like their people?', 'Share of women and age of MPs versus the population.', 'How much older and more male?'], zh: ['议员像国民吗？', '把议员的女性比例和年龄与国民相比。', '议会比国民更男性化、更年长多少？'], ko: ['의원은 국민을 닮았을까?', '국회의원의 여성 비율과 나이를 국민과 비교.', '얼마나 더 남성적이고 나이가 많을까?'], es: ['¿Se parecen los parlamentos a su pueblo?', 'Mujeres y edad de los diputados frente a la población.', '¿Cuánto más mayores y masculinos?'] }],
  ['sumeru', { ja: ['このパスポートで、どこに住める？', 'ビザ条件と物価・治安・ネット・気候を一覧に。', 'ビザなしで行ける暮らしやすい国は？'], en: ['Where could you live with your passport?', 'Visa rules with cost, safety, internet and climate.', 'Easy-entry countries that are good to live in?'], zh: ['用这本护照，可以住在哪里？', '签证条件与物价、治安、网络、气候一览。', '免签又宜居的国家？'], ko: ['이 여권으로 어디에 살 수 있을까?', '비자 조건과 물가·치안·인터넷·기후를 한눈에.', '무비자로 갈 수 있는 살기 좋은 나라는?'], es: ['¿Dónde podrías vivir con tu pasaporte?', 'Reglas de visado con coste, seguridad, internet y clima.', '¿Países fáciles de entrar y buenos para vivir?'] }],
  ['saigai', { ja: ['災害の被害は「備え」で決まる？', '災害死亡率を、豊かさから予想される値と比べる。', '予想より被害が大きい国は？'], en: ['Do disasters hit harder than wealth predicts?', 'Disaster death rates versus what income would predict.', 'Who suffers more than expected?'], zh: ['灾害伤亡由“准备”决定吗？', '把灾害死亡率与按收入预测的水平相比。', '哪些国家伤亡超出预期？'], ko: ['재해 피해는 “대비”가 좌우할까?', '재해 사망률을 소득으로 예상한 값과 비교.', '예상보다 피해가 큰 나라는?'], es: ['¿Golpean los desastres más de lo que predice la riqueza?', 'Mortalidad por desastres frente a la predicha por el ingreso.', '¿Quién sufre más de lo esperado?'] }],
];
let lang = getLang();
const sel = document.querySelector('select.lang');
sel.innerHTML = LANGS.map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
function draw() {
  const c = common[lang];
  document.documentElement.lang = lang; sel.value = lang; document.title = c.site;
  document.querySelector('#app').innerHTML = `<h1>${c.site}</h1><p class="lead">${c.tag}</p><div class="hub-grid">${S.map(([id, d], i) => `<a class="hub-card" href="${id}/?lang=${lang}"><span class="no">${String(i + 1).padStart(2, '0')}</span><h2>${d[lang][0]}</h2><p>${d[lang][1]}</p><span class="q">${d[lang][2]} →</span></a>`).join('')}</div>`;
  document.querySelector('#foot').innerHTML = `<a href="${REPO}" target="_blank" rel="noopener">${c.code}</a> · ${c.license}`;
}
sel.onchange = () => { lang = sel.value; try { localStorage.setItem('wc-lang', lang); } catch { } history.replaceState(null, '', '?lang=' + lang); draw(); };
draw();
</script>
</body>
</html>
